    </>}

    {tab==="scenic"&&<>{SCENIC.map(r=>{const allIn=r.c.every(id=>stops.find(s=>s.id===id));return <div key={r.id} style={{...card,borderLeft:`4px solid ${r.cl}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{r.n}</div><div style={{fontSize:10,color:"#888"}}>{r.d}</div>
            <div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap"}}>{r.c.map(id=>{const ci=C.find(c=>c.id===id);return ci?<span key={id} style={{fontSize:9,padding:"2px 6px",borderRadius:8,background:stops.find(s=>s.id===id)?"#e8f5e9":"#f5f5f0",color:stops.find(s=>s.id===id)?"#2e7d32":"#888",fontWeight:600}}>{ci.f}{ci.n}</span>:null;})}</div>
          </div>
          <button onClick={()=>{const ns=[...stops];r.c.forEach(id=>{if(!ns.find(s=>s.id===id))ns.push({id,days:1,tn:"",pl:""});});setSt(ns);if(!sC)upd(()=>({s:r.c[0]}));if(!eC)upd(()=>({e:r.c[r.c.length-1]}));}} style={{padding:"8px 12px",background:allIn?"#22863a":r.cl,color:"white",border:"none",borderRadius:8,fontSize:10,fontWeight:700,cursor:"pointer",flexShrink:0}}>{allIn?"✓":"+"}</button>
        </div></div>;})}
    </>}

    {tab==="hotels"&&<>
      {route.length<2?<div style={{...card,color:"#aaa",textAlign:"center"}}>Vel start/slutt i ⚡</div>:
      rc.map((c,i)=>{const day=dayMap[i];const ciD=giso(day);const coD=giso(day+1);
        const ca=ATT.filter(a=>a.ci===c.n&&a.ty==="food");
        return <div key={c.id+i} style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontSize:13,fontWeight:700}}>{c.f} {c.n} {c.ap?`✈${c.ap}`:""}</div>
              <div style={{fontSize:10,color:"#888"}}>{c.no} · Dag {day} · {gd(day)}</div></div>
            <span style={{fontSize:9,color:"#888",background:"#f5f5f0",padding:"2px 8px",borderRadius:8}}>📅 {gd(day)}</span>
          </div>
          <a href={bookUrl(c.n,ciD,coD)} target="_blank" rel="noopener" style={{display:"block",textAlign:"center",fontSize:11,fontWeight:700,background:"#003580",color:"white",padding:"8px",borderRadius:6,marginTop:6,textDecoration:"none"}}>🏨 Hotell i {c.n} — {ciD.slice(5)} →</a>
          {ca.length>0&&<div style={{marginTop:6,borderTop:"1px solid #eee",paddingTop:4}}>
            <div style={{fontSize:9,fontWeight:700,color:"#d97706",marginBottom:2}}>🍽️ Anbefalte restaurantar:</div>
            {ca.map(a=><div key={a.id} style={{fontSize:10,padding:"1px 0"}}>• <b>{a.n}</b> — {a.d}</div>)}
          </div>}
        </div>;
      })}
    </>}

    {tab==="budget"&&<>{(()=>{
      if(route.length<2)return <div style={{...card,color:"#aaa",textAlign:"center"}}>Vel start/slutt i ⚡</div>;
      // Stats
      const countries=[...new Set(rc.map(c=>c.f))];
      const totalKm=(()=>{let km=0;for(let i=0;i<route.length-1;i++){const cn=getConn(route[i],route[i+1]);if(cn)km+=cn.h*80;}return Math.round(km);})(); // ~80km/h avg
      const hstLegs=[];const nightLegs=[];const scenicLegs=[];
      for(let i=0;i<route.length-1;i++){const cn=getConn(route[i],route[i+1]);if(!cn)continue;if(cn.t===1||cn.t===3)hstLegs.push(i);if(cn.t===2)nightLegs.push(i);if(cn.t===4)scenicLegs.push(i);}
      const longestLeg=(()=>{let mx=0,mi=-1;for(let i=0;i<route.length-1;i++){const cn=getConn(route[i],route[i+1]);if(cn&&cn.h>mx){mx=cn.h;mi=i;}}return mi>=0?{h:mx,f:C.find(x=>x.id===route[mi])?.n,t:C.find(x=>x.id===route[mi+1])?.n}:null;})();
      const cheapest=rc.filter(c=>c.cost>0).sort((a,b)=>a.cost-b.cost)[0];
      const mostExp=rc.filter(c=>c.cost>0).sort((a,b)=>b.cost-a.cost)[0];
      const n=route.length;const ntc=nightLegs.length;
      const hn=Math.max(0,n-1-ntc);const ah=rc.length?Math.round(rc.reduce((a,c)=>a+c.cost,0)/rc.length*.55):60;
      const ht=hn*ah;const fd=n*25;const mu=rc.reduce((a,c)=>a+Math.min(c.cost*.15,20),0);
      const ft=(FLY[sC]||120)+(FLY[eC]||120);
      const rs=(()=>{let t=0;for(let i=0;i<n-1;i++){const cn=getConn(route[i],route[i+1]);if(!cn)continue;if(cn.t===2)t+=25;else if(cn.t===3)t+=15;else if(cn.t===4)t+=20;}return t;})();
      const td=n-1;const ps=[{n:"4d/1m",d:4,p:246},{n:"5d/1m",d:5,p:276},{n:"7d/1m",d:7,p:296},{n:"10d/2m",d:10,p:356},{n:"15d/2m",d:15,p:416},{n:"1m",d:30,p:496},{n:"3m",d:90,p:676}];
      const bp=ps.find(p=>p.d>=td)||ps[ps.length-1];const tot=ht+fd+ft+bp.p+rs+Math.round(mu);
      return <><div style={card}><div style={{fontSize:14,fontWeight:700,marginBottom:8}}>💰 Total</div>
        <div style={{fontSize:11,lineHeight:2}}>
          {[["✈️ Fly",ft],["🎫 Pass ("+bp.n+")",bp.p],["🏨 Hotell ("+hn+"n)",ht],["🍽️ Mat ("+n+"d)",fd],["🎟️ Res.",rs],["🏛️ Museum",Math.round(mu)]].map(([l,v])=>
            <div key={l} style={{display:"flex",justifyContent:"space-between"}}><span>{l}</span><b>{fmt(v)}</b></div>)}
          <div style={{display:"flex",justifyContent:"space-between",borderTop:"2px solid #c53d1b",paddingTop:6,marginTop:4,fontSize:16,fontWeight:800,color:COL.m}}><span>TOTALT</span><span>{fmt(tot)}</span></div>
        </div>{ntc>0&&<div style={{fontSize:10,color:"#059669",marginTop:4}}>🌙 {ntc} nattog = ~{fmt(ntc*ah)} spart!</div>}</div>
      <div style={card}><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>🎫 Pass ({td} reisedagar)</div>
        {ps.map(p=>{const r=p===bp;return <div key={p.n} style={{display:"flex",justifyContent:"space-between",padding:"4px 8px",marginBottom:2,borderRadius:6,background:r?"#fdf0ec":"#fafafa",border:r?"2px solid #c53d1b":"1px solid #eee"}}>
          <span style={{fontSize:11,fontWeight:r?700:400}}>{p.n}{r?" ←":""}</span><b>{fmt(p.p)}</b></div>;})}</div>
      <div style={card}><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>📊 Reisestatistikk</div>
        <div style={{fontSize:11,lineHeight:2}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>🌍 Land</span><b>{countries.length} ({countries.join(" ")})</b></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>🏙️ Byar</span><b>{rc.length}</b></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>📏 Estimert distanse</span><b>~{totalKm.toLocaleString()} km</b></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>🚄 Høgfartstog</span><b>{hstLegs.length} strekningar</b></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>🌙 Nattog</span><b>{nightLegs.length}</b></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>🏔️ Scenic</span><b>{scenicLegs.length}</b></div>
          {longestLeg&&<div style={{display:"flex",justifyContent:"space-between"}}><span>🐌 Lengste strekning</span><b>{longestLeg.f}→{longestLeg.t} ({longestLeg.h}t)</b></div>}
          {cheapest&&<div style={{display:"flex",justifyContent:"space-between"}}><span>💚 Billegaste by</span><b>{cheapest.f}{cheapest.n} ({fmt(cheapest.cost)}/d)</b></div>}
          {mostExp&&<div style={{display:"flex",justifyContent:"space-between"}}><span>💸 Dyraste by</span><b>{mostExp.f}{mostExp.n} ({fmt(mostExp.cost)}/d)</b></div>}
        </div>
      </div>
      {(()=>{const BEN={"🇨🇭":{n:"Sveits",b:["50% rabatt på fjellbaner (Jungfrau, Pilatus, Rigi)","Gratis buss/trikk i mange byar","Gratisbåt på innsjøar (Luzern, Zürich, Genève)"]},"🇦🇹":{n:"Austerrike",b:["ÖBB Lounge tilgang i Wien Hbf","Gratis Innsbruck Card-rabatt","Nattog NightJet med Interrail (res. påkravd)"]},"🇩🇪":{n:"Tyskland",b:["ICE utan reservasjon (gratis!)","S-Bahn gratis i alle byar","Flixbus 10% rabatt"]},"🇮🇹":{n:"Italia",b:["Gratis museum fyrste søndag i månaden","Frecciarossa krev reservasjon (~€13)","Regionale tog utan reservasjon"]},"🇫🇷":{n:"Frankrike",b:["TGV krev reservasjon (~€20-30)","Gratis metro Paris m/RER","Ouigo IKKJE inkludert"]},"🇪🇸":{n:"Spania",b:["AVE krev reservasjon (~€10)","Renfe-tog inkludert","Cercanías (lokaltog) gratis"]},"🇨🇿":{n:"Tsjekkia",b:["Alle tog inkludert utan res.","SC Pendolino res. valfri (~€4)","RegioJet/Leo Express IKKJE inkl."]},"🇵🇱":{n:"Polen",b:["PKP Intercity inkludert","EIP Pendolino res. påkravd (~€7)","Billeg mat overalt!"]},"🇳🇱":{n:"Nederland",b:["Alle NS-tog inkludert","Thalys krev res.","Gratis ferje til øyar"]},"🇩🇰":{n:"Danmark",b:["DSB-tog inkludert","Øresund-tog til Malmö inkl.","Reservasjon valfri"]},"🇸🇪":{n:"Sverige",b:["SJ-tog inkludert (res. anbefalt)","Nattog til Hamburg/Berlin","Arlanda Express IKKJE inkl."]},"🇳🇴":{n:"Noreg",b:["Vy-tog inkludert","Flåmsbana 30% rabatt","Hurtigruten IKKJE inkl."]},"🇭🇺":{n:"Ungarn",b:["MÁV-tog inkludert","Reservasjon gratis!","Budapest-kortet separat"]},"🇸🇮":{n:"Slovenia",b:["SŽ-tog inkludert","Bled Express inkl.","Lake Bled-båt 20% rabatt"]},"🇭🇷":{n:"Kroatia",b:["HŽPP-tog inkludert","Kystlinja Split–Zagreb","Ferje til øyar rabatt"]},"🇵🇹":{n:"Portugal",b:["CP-tog inkludert","Alfa Pendular res. påkravd","Lisboa Trikk 28 IKKJE inkl."]},"🇬🇷":{n:"Hellas",b:["Hellenic Train inkludert","Avgrensa rutenett","Ferjer til øyar rabatt"]}};
        const myCountries=countries.filter(f=>BEN[f]);
        return myCountries.length?<div style={card}><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>🎫 Interrail-fordelar per land</div>
          {myCountries.map(f=><div key={f} style={{marginBottom:6}}>
            <div style={{fontSize:11,fontWeight:700}}>{f} {BEN[f].n}</div>
            {BEN[f].b.map((b,i)=><div key={i} style={{fontSize:10,color:"#555",paddingLeft:8}}>• {b}</div>)}
          </div>)}
        </div>:null;
      })()}
      </>;})()}</>}

    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
